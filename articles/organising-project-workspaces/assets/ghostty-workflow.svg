<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .small { font-size: 12px; fill: #475569; }
      .prog { font-size: 14px; font-weight: 600; fill: #14532d; }
      .note { font-size: 14px; fill: #1e293b; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; }
      .user { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .emu { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .win { fill: #f8fafc; stroke: #2563eb; stroke-width: 1.5; }
      .bar { fill: #e2e8f0; }
      .pane { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="640" height="650" fill="#ffffff"/>

  <text x="320" y="40" text-anchor="middle" class="title">C · Terminal-native features with Ghostty</text>

  <rect x="220" y="60" width="200" height="40" rx="8" class="user"/>
  <text x="320" y="85" text-anchor="middle" class="lbl">You</text>
  <path d="M320 100V136" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="330" y="123" class="small">keys ↓  pixels ↑</text>

  <rect x="135" y="140" width="370" height="60" rx="10" class="emu"/>
  <text x="320" y="165" text-anchor="middle" class="lbl">Terminal emulator (Ghostty)</text>
  <text x="320" y="186" text-anchor="middle" class="sub">tabs, but no sessions</text>

  <path d="M215 200L182 271" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path d="M425 200L457 271" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="320" y="232" text-anchor="middle" class="sub">no middle layer, and no sessions:</text>
  <text x="320" y="252" text-anchor="middle" class="sub">one OS window stands in for each project</text>

  <!-- window project-a -->
  <rect x="50" y="275" width="265" height="180" rx="10" class="win"/>
  <path d="M60 275h245a10 10 0 0 1 10 10v20H50v-20a10 10 0 0 1 10-10z" class="bar"/>
  <circle cx="66" cy="290" r="4.5" fill="#f87171"/>
  <circle cx="80" cy="290" r="4.5" fill="#fbbf24"/>
  <circle cx="94" cy="290" r="4.5" fill="#4ade80"/>
  <text x="190" y="295" text-anchor="middle" class="small" style="font-weight:600">Ghostty window 1</text>
  <text x="182" y="330" text-anchor="middle" class="lbl">project-a</text>
  <rect x="62" y="345" width="75" height="45" rx="6" class="pane"/>
  <text x="99" y="373" text-anchor="middle" class="prog">nvim</text>
  <rect x="147" y="345" width="75" height="45" rx="6" class="pane"/>
  <text x="184" y="373" text-anchor="middle" class="prog">shell</text>
  <rect x="232" y="345" width="75" height="45" rx="6" class="pane"/>
  <text x="269" y="373" text-anchor="middle" class="prog">claude</text>
  <text x="182" y="416" text-anchor="middle" class="small">3 tabs in this window</text>
  <text x="182" y="438" text-anchor="middle" class="small">switch tab: Ghostty's tab keys</text>

  <!-- window project-b -->
  <rect x="325" y="275" width="265" height="180" rx="10" class="win"/>
  <path d="M335 275h245a10 10 0 0 1 10 10v20H325v-20a10 10 0 0 1 10-10z" class="bar"/>
  <circle cx="341" cy="290" r="4.5" fill="#f87171"/>
  <circle cx="355" cy="290" r="4.5" fill="#fbbf24"/>
  <circle cx="369" cy="290" r="4.5" fill="#4ade80"/>
  <text x="465" y="295" text-anchor="middle" class="small" style="font-weight:600">Ghostty window 2</text>
  <text x="457" y="330" text-anchor="middle" class="lbl">project-b</text>
  <rect x="337" y="345" width="75" height="45" rx="6" class="pane"/>
  <text x="374" y="373" text-anchor="middle" class="prog">nvim</text>
  <rect x="422" y="345" width="75" height="45" rx="6" class="pane"/>
  <text x="459" y="373" text-anchor="middle" class="prog">shell</text>
  <rect x="507" y="345" width="75" height="45" rx="6" class="pane"/>
  <text x="544" y="373" text-anchor="middle" class="prog">claude</text>
  <text x="457" y="416" text-anchor="middle" class="small">3 tabs in this window</text>
  <text x="457" y="438" text-anchor="middle" class="small">switch tab: Ghostty's tab keys</text>

  <rect x="190" y="470" width="260" height="30" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="320" y="490" text-anchor="middle" class="small" style="fill:#c2410c;font-weight:600">switch project = switch OS window</text>

  <text x="50" y="540" class="lbl">Trade-offs</text>
  <text x="50" y="567" class="note">✔  One layer of emulation, native graphics, config in dotfiles</text>
  <text x="50" y="592" class="note">✘  No sessions: you open and lay out each window by hand</text>
  <text x="50" y="617" class="note">✘  Not persistent: close a window and its programs end</text>
</svg>
