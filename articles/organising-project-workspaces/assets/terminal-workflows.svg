<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .lbl { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .small { font-size: 12px; fill: #475569; }
      .prog { font-size: 14px; font-weight: 600; fill: #14532d; }
      .note { font-size: 14px; fill: #1e293b; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; }
      .user { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .emu { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .tmux { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 7 4; }
      .sess { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .pane { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <line x1="600" y1="20" x2="600" y2="740" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== LEFT: tmux ===================== -->
  <text x="305" y="40" text-anchor="middle" class="title">A · With tmux</text>

  <rect x="205" y="60" width="200" height="40" rx="8" class="user"/>
  <text x="305" y="85" text-anchor="middle" class="lbl">You</text>
  <path d="M305 100V136" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="315" y="123" class="small">keys ↓  pixels ↑</text>

  <rect x="120" y="140" width="370" height="60" rx="10" class="emu"/>
  <text x="305" y="165" text-anchor="middle" class="lbl">Terminal emulator (Kitty / Ghostty)</text>
  <text x="305" y="186" text-anchor="middle" class="sub">parses escape codes → draws on the GPU</text>

  <path d="M305 200V236" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="315" y="223" class="small">one PTY</text>

  <rect x="90" y="240" width="430" height="90" rx="10" class="tmux"/>
  <text x="305" y="266" text-anchor="middle" class="lbl">tmux server  — a terminal inside a terminal</text>
  <text x="305" y="288" text-anchor="middle" class="sub">parses escape codes again, keeps its own screen grid,</text>
  <text x="305" y="306" text-anchor="middle" class="sub">then redraws that grid into the outer emulator</text>
  <text x="305" y="323" text-anchor="middle" class="small" fill="#c2410c" style="fill:#c2410c">extra layer of emulation</text>

  <path d="M200 330L167 361" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path d="M410 330L442 361" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- session project-a -->
  <rect x="35" y="365" width="265" height="165" rx="10" class="sess"/>
  <text x="167" y="390" text-anchor="middle" class="lbl">tmux session: project-a</text>
  <rect x="47" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="84" y="438" text-anchor="middle" class="prog">nvim</text>
  <rect x="132" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="169" y="438" text-anchor="middle" class="prog">shell</text>
  <rect x="217" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="254" y="438" text-anchor="middle" class="prog">claude</text>
  <text x="167" y="482" text-anchor="middle" class="small">3 panes, each with its own PTY to tmux</text>
  <text x="167" y="506" text-anchor="middle" class="small">switch: prefix + arrows</text>

  <!-- session project-b -->
  <rect x="310" y="365" width="265" height="165" rx="10" class="sess"/>
  <text x="442" y="390" text-anchor="middle" class="lbl">tmux session: project-b</text>
  <rect x="322" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="359" y="438" text-anchor="middle" class="prog">nvim</text>
  <rect x="407" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="444" y="438" text-anchor="middle" class="prog">shell</text>
  <rect x="492" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="529" y="438" text-anchor="middle" class="prog">claude</text>
  <text x="442" y="482" text-anchor="middle" class="small">3 panes, each with its own PTY to tmux</text>
  <text x="442" y="506" text-anchor="middle" class="small">switch session: prefix + s</text>

  <text x="40" y="575" class="lbl">Trade-offs</text>
  <text x="40" y="602" class="note">✔  Sessions persist: detach, close the terminal, reattach later</text>
  <text x="40" y="627" class="note">✔  Works the same in any terminal emulator, and over SSH</text>
  <text x="40" y="652" class="note">✘  Two layers of emulation: more CPU, memory and latency</text>
  <text x="40" y="677" class="note">✘  Graphics protocols (e.g. Kitty images) need passthrough</text>
  <text x="40" y="702" class="note">✘  A second keymap (prefix keys) on top of the terminal's</text>

  <!-- ===================== RIGHT: terminal-native ===================== -->
  <text x="895" y="40" text-anchor="middle" class="title">B · Terminal-native features</text>

  <rect x="795" y="60" width="200" height="40" rx="8" class="user"/>
  <text x="895" y="85" text-anchor="middle" class="lbl">You</text>
  <path d="M895 100V136" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="905" y="123" class="small">keys ↓  pixels ↑</text>

  <rect x="710" y="140" width="370" height="60" rx="10" class="emu"/>
  <text x="895" y="165" text-anchor="middle" class="lbl">Terminal emulator (Kitty)</text>
  <text x="895" y="186" text-anchor="middle" class="sub">parses escape codes → draws on the GPU</text>

  <path d="M790 200L757 361" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path d="M1000 200L1032 361" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="895" y="262" text-anchor="middle" class="sub">no middle layer:</text>
  <text x="895" y="282" text-anchor="middle" class="sub">every program's PTY talks</text>
  <text x="895" y="302" text-anchor="middle" class="sub">to the emulator directly</text>

  <!-- session project-a -->
  <rect x="625" y="365" width="265" height="165" rx="10" class="sess"/>
  <text x="757" y="390" text-anchor="middle" class="lbl">Kitty session: project-a</text>
  <rect x="637" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="674" y="438" text-anchor="middle" class="prog">nvim</text>
  <rect x="722" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="759" y="438" text-anchor="middle" class="prog">shell</text>
  <rect x="807" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="844" y="438" text-anchor="middle" class="prog">claude</text>
  <text x="757" y="482" text-anchor="middle" class="small">tabs / windows defined in a session file</text>
  <text x="757" y="506" text-anchor="middle" class="small">switch: terminal's own tab keys</text>

  <!-- session project-b -->
  <rect x="900" y="365" width="265" height="165" rx="10" class="sess"/>
  <text x="1032" y="390" text-anchor="middle" class="lbl">Kitty session: project-b</text>
  <rect x="912" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="949" y="438" text-anchor="middle" class="prog">nvim</text>
  <rect x="997" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="1034" y="438" text-anchor="middle" class="prog">shell</text>
  <rect x="1082" y="410" width="75" height="45" rx="6" class="pane"/>
  <text x="1119" y="438" text-anchor="middle" class="prog">claude</text>
  <text x="1032" y="482" text-anchor="middle" class="small">tabs / windows defined in a session file</text>
  <text x="1032" y="506" text-anchor="middle" class="small">switch session: Kitty's session keys</text>

  <text x="630" y="575" class="lbl">Trade-offs</text>
  <text x="630" y="602" class="note">✔  One layer of emulation: lighter and faster</text>
  <text x="630" y="627" class="note">✔  Native graphics (images render straight in nvim)</text>
  <text x="630" y="652" class="note">✔  Sessions are dotfiles, so they can be version controlled</text>
  <text x="630" y="677" class="note">✘  Not persistent (yet): close Kitty and the processes end</text>
  <text x="630" y="702" class="note">✘  Ghostty has tabs but no sessions: use one OS window</text>
  <text x="652" y="722" class="note">per project, with the tabs inside it</text>
</svg>
