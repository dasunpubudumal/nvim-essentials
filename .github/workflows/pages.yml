name: Publish notebooks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nbconvert
        run: pip install nbconvert ipython

      # Each day-NN/ folder becomes _site/day-NN/index.html (served at /day-NN/),
      # with its assets/ copied alongside so relative image paths keep working.
      - name: Convert notebooks to HTML
        run: |
          mkdir -p _site
          cp assets/favicon.svg assets/favicon.ico assets/apple-touch-icon.png _site/
          # Favicon tags for a page; $1 is the path prefix back to the site root.
          icons() {
            echo "<link rel=\"icon\" href=\"$1favicon.ico\" sizes=\"32x32\"><link rel=\"icon\" href=\"$1favicon.svg\" type=\"image/svg+xml\"><link rel=\"apple-touch-icon\" href=\"$1apple-touch-icon.png\">"
          }
          echo "<!doctype html><meta charset=\"utf-8\"><title>Neovim Essentials</title>$(icons '')<h1>Neovim Essentials</h1><ul>" > _site/index.html
          for dir in day-*/; do
            day="${dir%/}"
            nb=$(ls "$day"/*.ipynb 2>/dev/null | head -n 1)
            [ -z "$nb" ] && continue
            mkdir -p "_site/$day"
            jupyter nbconvert --to html "$nb" --output-dir "_site/$day" --output index
            sed -i "s|</head>|$(icons '../')</head>|" "_site/$day/index.html"
            python .github/scripts/add_toc.py "_site/$day/index.html"
            [ -d "$day/assets" ] && cp -r "$day/assets" "_site/$day/"
            echo "<li><a href=\"$day/\">$day</a></li>" >> _site/index.html
          done
          echo '</ul>' >> _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
