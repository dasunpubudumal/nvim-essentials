name: Publish notebooks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nbconvert
        run: pip install nbconvert ipython

      # Each day-NN/ folder becomes _site/day-NN/index.html (served at /day-NN/),
      # with its assets/ copied alongside so relative image paths keep working.
      # The pages are then themed, and the sessions page is built from them.
      - name: Convert notebooks to HTML
        run: |
          mkdir -p _site
          cp assets/favicon.svg assets/favicon.ico assets/apple-touch-icon.png _site/
          cp .github/site/theme.css .github/site/notebook.css _site/
          for dir in day-*/; do
            day="${dir%/}"
            nb=$(ls "$day"/*.ipynb 2>/dev/null | head -n 1)
            [ -z "$nb" ] && continue
            mkdir -p "_site/$day"
            jupyter nbconvert --to html "$nb" --output-dir "_site/$day" --output index
            [ -d "$day/assets" ] && cp -r "$day/assets" "_site/$day/"
          done
          python .github/scripts/style_notebooks.py _site
          python .github/scripts/build_index.py .github/site/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
