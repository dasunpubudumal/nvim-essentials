<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 190" width="1030" height="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .lbl { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .small { font-size: 12px; fill: #475569; }
      .tag { font-size: 14px; font-weight: 600; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; }
      .dashed { stroke-dasharray: 5 4; }
      .bracket { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .input { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .ts { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .lsp { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .ir { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1030" height="190" fill="#ffffff"/>

  <!-- Stages -->
  <rect x="20" y="30" width="120" height="56" rx="10" class="input"/>
  <text x="80" y="54" text-anchor="middle" class="lbl">source code</text>
  <text x="80" y="74" text-anchor="middle" class="sub">characters</text>
  <path d="M140 58H168" class="edge" marker-end="url(#arr)"/>

  <rect x="170" y="30" width="180" height="56" rx="10" class="ts"/>
  <text x="260" y="54" text-anchor="middle" class="lbl">Lexical analysis</text>
  <text x="260" y="74" text-anchor="middle" class="sub">→ tokens</text>
  <path d="M350 58H378" class="edge" marker-end="url(#arr)"/>

  <rect x="380" y="30" width="180" height="56" rx="10" class="ts"/>
  <text x="470" y="54" text-anchor="middle" class="lbl">Syntactic analysis</text>
  <text x="470" y="74" text-anchor="middle" class="sub">→ syntax tree</text>
  <path d="M560 58H588" class="edge" marker-end="url(#arr)"/>

  <rect x="590" y="30" width="180" height="56" rx="10" class="lsp"/>
  <text x="680" y="54" text-anchor="middle" class="lbl">Semantic analysis</text>
  <text x="680" y="74" text-anchor="middle" class="sub">→ symbol table, types</text>
  <path d="M770 58H798" class="edge" marker-end="url(#arr)"/>

  <rect x="800" y="30" width="120" height="56" rx="10" class="ir"/>
  <text x="860" y="54" text-anchor="middle" class="lbl">IR</text>
  <text x="860" y="74" text-anchor="middle" class="sub">→ simple steps</text>
  <path d="M920 58H948" class="edge dashed" marker-end="url(#arr)"/>
  <text x="954" y="62" class="sub">backend</text>

  <!-- Who does what -->
  <path d="M170 98V108H560V98M365 108V120" class="bracket"/>
  <rect x="300" y="120" width="130" height="30" rx="8" class="ts"/>
  <text x="365" y="140" text-anchor="middle" class="tag" fill="#14532d">Treesitter</text>
  <text x="365" y="172" text-anchor="middle" class="small">the current buffer: its shape</text>

  <path d="M590 98V108H770V98M680 108V120" class="bracket"/>
  <rect x="600" y="120" width="160" height="30" rx="8" class="lsp"/>
  <text x="680" y="140" text-anchor="middle" class="tag" fill="#1e3a8a">Language server</text>
  <text x="680" y="172" text-anchor="middle" class="small">the whole project: its meaning</text>
</svg>
